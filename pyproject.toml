[project]
name = "blastradius-mcp"
version = "0.1.0"
description = "Cross-repo infrastructure memory for coding agents"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.scripts]
blastradius = "blastradius.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blastradius"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
